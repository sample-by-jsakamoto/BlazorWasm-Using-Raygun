name: github pages

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # Checkout the code
      - uses: actions/checkout@v5

      # Install .NET SDK
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
      - name: Install .NET WebAssembly Tools
        run: dotnet workload install wasm-tools

      # Set Raygun API key to the application settings
      - name: Set Raygun API Key
        env:
          RAYGUN_API_KEY: ${{ vars.RAYGUN_API_KEY }}
        run: sed -i "s|\${RAYGUN_API_KEY}|${RAYGUN_API_KEY}|g" RaygunTestApp.Client/wwwroot/appsettings.json

      # Publish the site
      - name: Publish
        run: dotnet publish RaygunTestApp.Client/RaygunTestApp.Client.csproj -o public -p GHPages=true

      # Deploy the site
      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: public/wwwroot
          force_orphan: true
